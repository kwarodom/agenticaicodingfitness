<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harness Lab Runner — Week 31</title>
<style>
  :root{
    /* design tokens: navy surfaces, teal = OK/primary, amber = partial, magenta = failed */
    --bg:#0a1729; --panel:#10213a; --panel2:#16304f; --line:rgba(120,200,255,.18);
    --txt:#e3eefb; --dim:#8aa4c2; --accent:#3fd0c9; --green:#3fd0c9;
    --amber:#f2b64c; --red:#ff5c8a; --violet:#b69cff; --cyan:#4aa3ff; --term:#06101e; --nv:#76b900;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);
         background:var(--panel);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  header .sub{color:var(--dim);font-size:12px;flex:1 1 120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow{flex:1}
  .pill{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);
        display:inline-flex;align-items:center;gap:6px}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .pill.real .dot{background:var(--green)} .pill.sim .dot{background:var(--cyan)}
  .pill.sim{color:var(--cyan)} .pill.real{color:var(--green)}
  .tbtn{font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;
        border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  .tbtn:hover:not(:disabled){border-color:var(--accent)} .tbtn:disabled{opacity:.4;cursor:not-allowed}
  .progress{height:3px;background:var(--panel2)}
  .progress > div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .5s}
  .hdr-prog{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  /* ── path switch bar (sticky top strip) ── */
  .pathbar{display:flex;gap:10px;align-items:center;padding:8px 20px;background:var(--panel);
        border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:12px;color:var(--dim)}
  .pbtn{font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;
        border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  .pbtn:hover{border-color:var(--accent)}
  .pbtn.on{border-color:var(--accent);color:var(--green);background:rgba(63,185,80,.14)}
  #pathfields{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #pathfields input{font:inherit;font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);
        background:var(--panel2);color:var(--txt);width:360px;max-width:70vw}
  #pathfields input::placeholder{color:#566074}
  #model-sel{font:inherit;font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);
        background:var(--panel2);color:var(--txt);max-width:280px}
  #model-sel:disabled{opacity:.5}
  .pfhint{font-size:11px;color:var(--dim)}
  /* visually hidden, still in the light DOM — the voice guide reads this */
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
           clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  /* ── main grid: sidebar + content ── */
  .main{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .side{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:6px 0 20px}
  .fold{border-bottom:1px solid var(--line)}
  /* .fhead / .sec are real <button>s (keyboard + screen-reader + AI-assistant reachable) — reset the chrome */
  .fhead,.sec{width:100%;background:none;border:0;text-align:left;font-family:inherit;color:inherit}
  .fhead{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:12.5px}
  .fhead:hover{background:var(--panel2)} .fhead.cur .ft{color:var(--accent)}
  .chev{color:var(--dim);width:10px;flex:0 0 10px}
  .fnum{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:700}
  .ft{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ring{flex:0 0 16px}
  .fct{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .fsecs{padding:2px 0 8px}
  .sec{display:flex;gap:9px;align-items:center;padding:6px 14px 6px 32px;cursor:pointer;font-size:12.5px;
       border-left:3px solid transparent;color:#cdd3df}
  .sec:hover{background:var(--panel2)}
  .sec.sel{background:var(--panel2);border-left-color:var(--accent);color:var(--txt)}
  .sec.done .t{color:var(--green)}
  .sec .ico{flex:0 0 18px;text-align:center;font-size:11px;color:var(--dim)}
  .okico{color:var(--green);font-weight:700}
  .sec .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ── content column ── */
  .content{overflow:auto;padding:24px 28px;min-width:0}
  .crumb{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .content h2{font-size:21px;margin:6px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lv{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px}
  .lv.beginner{background:rgba(63,185,80,.16);color:var(--green)}
  .lv.intermediate{background:rgba(86,212,221,.16);color:var(--cyan)}
  .lv.advanced{background:rgba(188,140,255,.16);color:var(--violet)}
  .lv.all{background:rgba(210,153,34,.16);color:var(--amber)}
  .metachips{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
  .chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:var(--panel)}
  .pwarn{font-size:12px;color:var(--amber);border:1px solid rgba(210,153,34,.4);background:rgba(210,153,34,.08);
        border-radius:8px;padding:8px 12px;margin:0 0 12px}
  .waitmsg{margin:40px auto;max-width:520px;text-align:center;color:var(--amber);font-size:13px;
        border:1px solid rgba(210,153,34,.4);background:rgba(210,153,34,.07);border-radius:10px;padding:18px 22px}
  .navrow{display:flex;gap:12px;align-items:center;margin:26px 0 8px;border-top:1px solid var(--line);padding-top:16px}
  .navlbl{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  /* ── bespoke markdown ── */
  .md{max-width:880px;color:#cdd3df}
  .md p{margin:10px 0;line-height:1.6}
  .md h3{color:var(--txt);font-size:16px;margin:20px 0 8px}
  .md h4{color:var(--accent);font-size:13.5px;margin:16px 0 6px}
  .md b{color:var(--txt)}
  .md a{color:var(--accent)}
  .md code{background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:12px;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .md table{border-collapse:collapse;font-size:12.5px;margin:10px 0;width:100%;max-width:860px}
  .md td,.md th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  .md th{background:var(--panel2);color:var(--txt)}
  .md blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--panel);
        color:var(--dim);border-radius:0 8px 8px 0;font-size:12.5px}
  .md ul,.md ol{margin:8px 0 8px 4px;padding-left:22px}
  .md li{margin:4px 0;line-height:1.55}
  .md details{margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}
  .md summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
  .codewrap{position:relative;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--term);overflow:hidden}
  .codewrap pre{margin:0;padding:11px 13px;overflow:auto;max-height:340px;
        font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d5dae4}
  .codewrap.expected{border-style:dashed}
  .codewrap.expected pre{color:#8a93a6}
  .codewrap.expected::before{content:"expected output";position:absolute;left:10px;top:4px;font-size:9.5px;
        letter-spacing:.08em;text-transform:uppercase;color:#566074}
  .codewrap.expected pre{padding-top:22px}
  .copy{position:absolute;top:6px;right:6px;font:inherit;font-size:10.5px;padding:3px 8px;border-radius:6px;
        cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
  .copy:hover{border-color:var(--accent);color:var(--txt)}
  /* checkpoint card */
  .ckpt{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:11px 14px;cursor:pointer;
        border:1px solid rgba(63,185,80,.45);border-radius:10px;background:rgba(63,185,80,.07)}
  .ckpt input{margin-top:2px;accent-color:var(--green);width:15px;height:15px;cursor:pointer;flex:0 0 15px}
  .ckpt .ckmark{color:var(--green);font-weight:700;font-size:12px;white-space:nowrap}
  .ckpt .cktxt{flex:1;font-size:13px;line-height:1.5}
  .ckpt.done{background:rgba(63,185,80,.16)}
  .ckpt.done .cktxt{color:var(--green)}
  /* ── lab cards + terminal ── */
  .labsec{margin-top:18px}
  .labshead{font-size:15px;margin:0 0 4px;color:var(--txt)}
  .labcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:12px 0;overflow:hidden;max-width:880px}
  .labtop{display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
  .labfile{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--accent);font-weight:650}
  .labtitle{font-size:12.5px;color:var(--dim)}
  .spark{display:inline-flex;align-items:center;gap:7px}
  .spark svg{display:block}
  .skline{fill:none;stroke:var(--line);stroke-width:1.4}
  .sparknone{font-size:10.5px;color:#566074}
  .sklast{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sklast.ok{color:var(--green)} .sklast.bad{color:var(--red)}
  .run{font:inherit;font-size:13px;font-weight:650;padding:7px 16px;border-radius:9px;cursor:pointer;
       border:1px solid var(--green);background:rgba(63,185,80,.16);color:var(--txt)}
  .run:hover:not(:disabled){background:rgba(63,185,80,.30)} .run:disabled{opacity:.45;cursor:not-allowed}
  pre.src{margin:0;max-height:0;overflow:auto;transition:max-height .25s;background:var(--term);
          border-top:1px solid transparent;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          font-size:12px;color:#cdd3df;padding:0 14px}
  pre.src.open{max-height:420px;padding:12px 14px;border-top-color:var(--line)}
  .term-wrap{border-top:1px solid var(--line);background:var(--term)}
  .term-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#0d1017;border-bottom:1px solid var(--line);
            font-size:11px;color:var(--dim)}
  .term-bar .d{width:11px;height:11px;border-radius:50%} .term-bar .clr{margin-left:auto;cursor:pointer}
  .term-bar .clr:hover{color:var(--txt)}
  .term{padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
        white-space:pre-wrap;word-break:break-word;min-height:60px;max-height:48vh;overflow:auto;color:#d5dae4}
  .footer{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);display:none}
  .footer.show{display:block} .footer .pass{color:var(--green)} .footer .failc{color:var(--red)}
  .sp{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;
      display:inline-block;animation:rot .7s linear infinite;vertical-align:-1px}
  @keyframes rot{to{transform:rotate(360deg)}}
  /* narration colors — house colorize contract */
  .l-step{color:var(--green);font-weight:600}
  .l-sim{color:var(--cyan);font-weight:600}
  .l-prompt{color:var(--cyan)}
  .l-reason{color:#7a8499;font-style:italic}
  .l-answer{color:#d5dae4}
  .l-metric{color:var(--cyan);font-weight:600}
  .l-act{color:var(--amber);font-weight:600}
  .l-observe{color:var(--green)}
  .l-result{color:var(--violet);font-weight:600}
  .l-pass{color:var(--green);font-weight:600}
  .l-warn{color:var(--amber);font-weight:600}
  .l-fail{color:var(--red);font-weight:600}
  .l-banner{color:var(--accent)}
  .l-cmd{color:#9fb8d4}
  /* ── built-in terminal drawer ── */
  .copy.torun{right:58px;color:var(--green);border-color:rgba(63,185,80,.5)}
  .copy.torun:hover{border-color:var(--green);color:var(--txt);background:rgba(63,185,80,.15)}
  .shdrawer{border-top:1px solid var(--line);background:var(--term);flex:0 0 auto}
  .shbar{display:flex;align-items:center;gap:9px;padding:7px 16px;background:#0d1017;cursor:pointer;
         font-size:11.5px;color:var(--dim);user-select:none}
  .shbar:hover{color:var(--txt)}
  .shbar .d{width:11px;height:11px;border-radius:50%}
  .shbar b{color:var(--txt);font-weight:650}
  .shbar .clr:hover{color:var(--red)}
  .shstate{font-variant-numeric:tabular-nums}
  .shstate.run{color:var(--amber)} .shstate.ok{color:var(--green)} .shstate.bad{color:var(--red)}
  .shbody{display:none}
  .shdrawer.open .shbody{display:block}
  #sh-term{min-height:40px;max-height:34vh}
  .shrow{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-top:1px solid var(--line)}
  .shps1{color:var(--green);font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700}
  #sh-in{flex:1;resize:none;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel2);
         color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:34px}
  #sh-in:focus{outline:none;border-color:var(--accent)}
  #sh-in::placeholder{color:#566074}
  /* ── hero banners ── */
  .herocard{max-width:880px;margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .herocard img{display:block;width:100%;max-height:180px;object-fit:cover}
  header{position:relative}
  header.hashero::after{content:"";position:absolute;top:0;right:0;bottom:0;left:45%;z-index:0;pointer-events:none;
    background:var(--heroimg) right center/cover no-repeat;opacity:.26;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%)}
  header.hashero>*{position:relative;z-index:1}
  /* ── diagram cards (dark metric-card style) ── */
  .diagwrap{max-width:980px}
  .dcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;margin:14px 0;min-width:0}
  .dcard .dtitle{margin:0 0 10px;font-size:14px;color:var(--txt);font-weight:650}
  .dunit{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:500;
    vertical-align:2px;margin-left:6px}
  .dcard .dcap{margin:10px 0 0;font-size:12px;color:var(--dim);line-height:1.5}
  .dcard svg{display:block;width:100%;height:auto}
  .diag-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  .diag-grid .dcard{margin:0}
  @media(max-width:900px){.diag-grid{grid-template-columns:1fr}}
  .dlegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dim)}
  .dlegend span{display:inline-flex;align-items:center;gap:6px}
  .dlegend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  /* diagram svg typography */
  .dcard svg text{font-family:inherit}
  .dg-lane{fill:rgba(255,255,255,.015)} .dg-lane.alt{fill:rgba(63,185,80,.03)}
  .dg-lanelbl{fill:var(--dim);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .dg-nlbl{fill:var(--txt);font-size:11px;font-weight:600}
  .dg-nsub{fill:var(--dim);font-size:8.5px}
  .dg-elbl{fill:var(--dim);font-size:9px;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
  .dg-actor{fill:var(--txt);font-size:11px;font-weight:600}
  .dg-msg{fill:#cdd3df;font-size:9.5px;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
  .dg-msg.ret{fill:var(--dim)}
  .dg-note{fill:var(--amber);font-size:9.5px;font-style:italic}
  .dg-axis{fill:var(--dim);font-size:9px}
  .dg-val{fill:var(--txt);font-size:9px;font-weight:600}
  .dg-big{fill:var(--txt);font-size:22px;font-weight:700}
  /* sequence arrows fade in, staggered */
  .sqs{opacity:0;animation:sqIn .45s ease forwards}
  @keyframes sqIn{to{opacity:1}}
  /* chart grow animations — armed when .dchart gains .iv (IntersectionObserver) */
  .dchart .cbar{transform:scaleY(0);transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.2,.8,.25,1)}
  .dchart .chbar{transform:scaleX(0);transform-box:fill-box;transform-origin:0 50%;transition:transform .7s cubic-bezier(.2,.8,.25,1)}
  .dchart.iv .cbar,.dchart.iv .chbar{transform:none}
  .dchart .cline{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease .1s}
  .dchart.iv .cline{stroke-dashoffset:0}
  .dchart .cdot,.dchart .cval{opacity:0;transition:opacity .4s ease}
  .dchart.iv .cdot,.dchart.iv .cval{opacity:1}
  .dchart .cseg{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.25,1)}
  @media (prefers-reduced-motion: reduce){
    .sqs{animation:none;opacity:1}
    .dchart .cbar,.dchart .chbar{transform:none;transition:none}
    .dchart .cline{stroke-dashoffset:0;transition:none}
    .dchart .cdot,.dchart .cval{opacity:1;transition:none}
    .dchart .cseg{transition:none}
  }
  /* ── mode switch, exercise cards, inline Ask blocks ── */
  .pbtn.on{border-color:var(--accent);color:var(--accent);background:rgba(118,185,0,.13)}
  .pbtn:disabled{opacity:.4;cursor:not-allowed}
  .tbtn.sm{font-size:11px;padding:4px 9px}
  .labmode{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;vertical-align:2px;
    background:rgba(86,212,221,.14);color:var(--cyan);margin-left:6px}
  .labmode.live{background:rgba(118,185,0,.16);color:var(--accent)}
  .ftag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .ftag.ex{background:rgba(210,153,34,.16);color:var(--amber)} .ftag.sol{background:rgba(188,140,255,.14);color:var(--violet)}
  .solcard{border-style:dashed;margin-top:-4px;background:transparent}
  .cellblk{margin:14px 0;border:1px solid rgba(118,185,0,.45);border-radius:10px;background:var(--panel);overflow:hidden;max-width:880px}
  .cellbar{display:flex;gap:8px;align-items:center;padding:7px 10px;background:rgba(118,185,0,.07);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .celltag{font-size:11.5px;color:var(--accent);font-weight:650}
  .run.cellask{border-color:var(--accent);background:rgba(118,185,0,.16);font-size:12.5px;padding:6px 14px}
  .run.cellask:hover:not(:disabled){background:rgba(118,185,0,.3)}
  .cellsrc{display:block;width:100%;border:0;resize:vertical;background:var(--term);color:#d5dae4;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:11px 13px;outline:none;tab-size:2}
  .cellsrc:focus{box-shadow:inset 0 0 0 1px var(--accent)}
  .cellout{display:none;border-top:1px solid var(--line);padding:11px 14px 6px}
  .cellout.show{display:block}
  .jhead{font-size:11.5px;color:var(--dim);margin-bottom:8px;font-variant-numeric:tabular-nums}
  .jhead b{color:var(--txt)}
  .jsrc{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px;margin-right:4px}
  .jsrc.live{background:rgba(118,185,0,.18);color:var(--accent)} .jsrc.rec{background:rgba(86,212,221,.16);color:var(--cyan)}
  .jsrc.ph{background:rgba(210,153,34,.18);color:var(--amber)}
  .jwarn{font-size:12px;color:var(--amber);border:1px solid rgba(210,153,34,.4);background:rgba(210,153,34,.08);border-radius:8px;padding:7px 11px;margin:6px 0 10px}
  .jwarn.bad{color:var(--red);border-color:rgba(248,81,73,.45);background:rgba(248,81,73,.08)}
  .jnote{font-size:11.5px;color:var(--cyan);margin:0 0 8px}

<script>
"use strict";
/* ── Harness Lab Runner — one continuous Week 31 course ───────────────────── */
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

let COURSE=[],FLAT=[],cur=0,RUNNING=false,attempt=0;
let CKS={}; try{CKS=JSON.parse(localStorage.getItem("rl.cks")||"{}")||{};}catch(e){CKS={};}
const termCache={},footCache={},srcCache={},openSrc={},expanded=new Set();

/* ── checkpoints ── */
function scanCks(md){
  let n=0,fence=false;
  for(const raw of String(md).split("\n")){
    const t=raw.trim();
    if(t.startsWith("```")){fence=!fence;continue;}
    if(!fence&&/^✓\s*Checkpoint/.test(t))n++;
  }
  return n;
}
function ckKey(fi,si,i){const c=COURSE[fi];return c.folder+"/"+c.sections[si].id+"/"+i;}
function secTicked(fi,si){
  const s=COURSE[fi].sections[si];let n=0;
  for(let i=0;i<s.ckTotal;i++)if(CKS[ckKey(fi,si,i)])n++;
  return n;
}
function foldCounts(fi){
  let t=0,d=0;
  COURSE[fi].sections.forEach((s,si)=>{t+=s.ckTotal;d+=secTicked(fi,si);});
  return [d,t];
}
function courseCounts(){
  let t=0,d=0;
  COURSE.forEach((c,fi)=>{const r=foldCounts(fi);d+=r[0];t+=r[1];});
  return [d,t];
}
function saveCksLocal(){try{localStorage.setItem("rl.cks",JSON.stringify(CKS));}catch(e){}}
function tickCk(el){
  const k=el.dataset.key;
  if(el.checked)CKS[k]=true; else delete CKS[k];
  saveCksLocal();                                   // offline fallback / instant
  // write through to the server so progress survives a browser switch
  fetch("/api/progress",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({key:k,done:el.checked})}).catch(()=>{});
  const card=el.closest(".ckpt"); if(card)card.classList.toggle("done",el.checked);
  renderSide();
}
async function loadServerProgress(){
  // Server is the source of truth; merge any local-only ticks up to it once
  // (first-run migration), so nobody loses progress made before this feature.
  let server={};
  try{server=(await(await fetch("/api/progress")).json()).checkpoints||{};}catch(e){return;}

      `${LANG==="th"?"แล้วหน้านี้จะโหลดเองภายในไม่กี่วินาที — ระหว่างนี้ทำ 📝 แบบทดสอบก่อนเรียน (Form P) ได้":"and this page picks it up within a few seconds — meanwhile, take the 📝 pre-test (Form P)."}</div>`;

/* ── bespoke markdown renderer — exactly what the TUTORIAL.md template uses ── */
function inline(s){
  s=esc(s);
  // ``code with `backticks` inside`` first (standard markdown), then plain `code`
  s=s.replace(/``\s?(.+?)\s?``|`([^`]+)`/g,(m,a,b)=>`<code>${a!==undefined?a:b}</code>`);
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>");
  return s;
}
function mdRender(md,fi,si){
  const lines=String(md).split("\n"),out=[];
  let i=0,ck=0,prevText="",para=[];
  // skip a leading heading — it duplicates the section title shown above
  while(i<lines.length&&!lines[i].trim())i++;
  if(i<lines.length&&/^#{1,2}\s/.test(lines[i].trim()))i++;
  const flushPara=()=>{
    if(para.length){out.push(`<p>${para.map(inline).join(" ")}</p>`);prevText=para.join(" ");para=[];}
  };
  while(i<lines.length){
    const raw=lines[i],t=raw.trim();
    if(!t){flushPara();i++;continue;}
    if(t.startsWith("```")){                                   // fenced code + copy button
      flushPara();
      const lang=t.slice(3).trim().toLowerCase();
      const exp=/expected output/i.test(prevText);
      i++;const buf=[];
      while(i<lines.length&&!lines[i].trim().startsWith("```")){buf.push(lines[i]);i++;}
      i++;
      out.push(`<div class="codewrap${exp?" expected":""}">`+
               (exp?"":`<button class="copy torun" onclick="sendToTerm(this)" title="load into the built-in terminal">▶ run</button>`)+
               `<button class="copy" onclick="copyCode(this)">copy</button>`+
               `<pre><code>${esc(buf.join("\n"))}</code></pre></div>`);
      prevText="";continue;
    }
    const mm=t.match(/^!\[([^\]]*)\]\(([A-Za-z0-9_.\-\/]+)\)$/);
    if(mm){                                                    // ![caption](media/x.png|wav|mp4) → media figure
      flushPara();out.push(mediaFig(mm[2],mm[1],COURSE[fi].folder));prevText=t;i++;continue;
    }
    if(/^✓\s*Checkpoint/.test(t)){                             // ✓ checkpoint → tickable card
      flushPara();
      const key=ckKey(fi,si,ck);ck++;
      const body=t.replace(/^✓\s*Checkpoint:?\s*/,"");
      const on=!!CKS[key];
      out.push(`<label class="ckpt${on?" done":""}"><input type="checkbox" data-key="${esc(key)}" ${on?"checked":""} `+
               `onchange="tickCk(this)"><span class="ckmark">${esc(tr("checkpoint"))}</span><span class="cktxt">${inline(body)}</span></label>`);
      prevText=t;i++;continue;
    }
    if(/^<\/?(details|summary)/i.test(t)){                     // <details><summary> passthrough
      flushPara();out.push(raw);prevText="";i++;continue;
    }
    if(t.startsWith("###")){flushPara();out.push(`<h4>${inline(t.replace(/^#+\s*/,""))}</h4>`);prevText=t;i++;continue;}
    if(t.startsWith("#")){flushPara();out.push(`<h3>${inline(t.replace(/^#+\s*/,""))}</h3>`);prevText=t;i++;continue;}
    if(t.startsWith(">")){                                     // blockquote
      flushPara();const buf=[];
      while(i<lines.length&&lines[i].trim().startsWith(">")){buf.push(lines[i].trim().replace(/^>\s?/,""));i++;}
      out.push(`<blockquote>${buf.map(inline).join("<br>")}</blockquote>`);prevText=buf.join(" ");continue;
    }
    if(t.startsWith("|")&&i+1<lines.length&&/^\|[\s:|-]+\|?$/.test(lines[i+1].trim())){  // table
      flushPara();const rows=[];
      while(i<lines.length&&lines[i].trim().startsWith("|")){rows.push(lines[i].trim());i++;}
      const cells=r=>r.replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim());
      let html=`<table><thead><tr>${cells(rows[0]).map(x=>`<th>${inline(x)}</th>`).join("")}</tr></thead><tbody>`;
      for(let r=2;r<rows.length;r++)html+=`<tr>${cells(rows[r]).map(x=>`<td>${inline(x)}</td>`).join("")}</tr>`;
      out.push(html+`</tbody></table>`);prevText="";continue;
    }
    if(/^[-*]\s+/.test(t)){                                    // unordered list
      flushPara();const buf=[];
      while(i<lines.length&&/^[-*]\s+/.test(lines[i].trim())){buf.push(lines[i].trim().replace(/^[-*]\s+/,""));i++;}
      out.push(`<ul>${buf.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`);prevText=buf.join(" ");continue;
    }
    if(/^\d+\.\s+/.test(t)){                                   // ordered list
      flushPara();const buf=[];const start=parseInt(t,10)||1;
      while(i<lines.length&&/^\d+\.\s+/.test(lines[i].trim())){buf.push(lines[i].trim().replace(/^\d+\.\s+/,""));i++;}
      out.push(`<ol start="${start}">${buf.map(x=>`<li>${inline(x)}</li>`).join("")}</ol>`);prevText=buf.join(" ");continue;
    }
    para.push(t);i++;
  }
  flushPara();
  return out.join("\n");
}
function mediaSrc(folder,rel){
  rel=rel.replace(/^\.\//,"");
  if(!/^(media|\.runs)\//.test(rel)||rel.indexOf("..")>=0)return null;
  return `/w31media/${encodeURIComponent(folder)}/${rel.split("/").map(encodeURIComponent).join("/")}`;
}
function mediaTag(src,alt){
  const ext=(src.split("?")[0].split(".").pop()||"").toLowerCase();
  if(["png","jpg","jpeg","webp","gif"].includes(ext))return `<img src="${src}" alt="${esc(alt)}" loading="lazy">`;
  if(["wav","mp3","m4a","ogg"].includes(ext))return `<audio controls preload="none" src="${src}" aria-label="${esc(alt)}"></audio>`;
  if(["mp4","webm"].includes(ext))return `<video controls preload="metadata" playsinline src="${src}" aria-label="${esc(alt)}"></video>`;
  return "";
}
function mediaFig(rel,alt,folder){
  const src=mediaSrc(folder,rel);
  if(!src)return `<p>${inline("!["+alt+"]("+rel+")")}</p>`;
  return `<figure class="mediafig">${mediaTag(src,alt)}${alt?`<figcaption>${inline(alt)}</figcaption>`:""}</figure>`;
}
function copyCode(btn){
  const code=btn.parentElement.querySelector("code");
  const done=()=>{btn.textContent="copied ✓";setTimeout(()=>{btn.textContent="copy";},1200);};
  try{navigator.clipboard.writeText(code.textContent).then(done,()=>{btn.textContent="copy failed";});}
  catch(e){btn.textContent="copy failed";}
}

function fileKey(fi,rel){return COURSE[fi].folder+"/"+rel;}
function fid(fi,rel){return fi+"-"+rel.replace(/[^a-z0-9]/gi,"_");}
let HIST={};
async function loadHistory(){
  try{HIST=await(await fetch("/api/history")).json()||{};}catch(e){}
}
function sparkHTML(key){
  const runs=(HIST[key]||[]).slice(-20);
  if(!runs.length)return `<span class="sparknone">${esc(tr("noRuns"))}</span>`;
  const secs=runs.map(r=>+r.seconds||0),mx=Math.max(...secs,0.1);
  const W=110,H=22,step=runs.length>1?W/(runs.length-1):0;
  const pt=i=>[runs.length>1?(i*step).toFixed(1):W/2,(H-3-(secs[i]/mx)*(H-8)).toFixed(1)];
  const line=runs.length>1?`<polyline points="${runs.map((r,i)=>pt(i).join(",")).join(" ")}" class="skline"/>`:"";
  const dots=runs.map((r,i)=>{const p=pt(i);
    const c=r.code===0?"var(--green)":r.code===124?"var(--amber)":"var(--red)";
    return `<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="${c}"><title>${new Date(r.ts*1000).toLocaleString()} · ${esc(r.mode||"")} · ${r.code===0?"✓":"✕ "+r.code} · ${r.seconds}s${r.cost?" · $"+(+r.cost).toFixed(6):""}</title></circle>`;}).join("");
  const last=runs[runs.length-1];
  const lbl=`${last.code===0?"✓":"✕"} ${last.seconds}s${last.cost?" · $"+(+last.cost).toFixed(5):""}`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${line}${dots}</svg>`+
         `<span class="sklast ${last.code===0?"ok":"bad"}">${esc(lbl)}</span>`;
}

/* house colorize: ▣/◈/✓/⚠/✕ + the rest of the glyph vocabulary */
function colorize(text){
  return esc(text).split("\n").map(line=>{
    const out=colorLine(line);
    const mm=line.match(/week31_harness2_recursive_harnessing\/(\d\d_[a-z0-9_]+)\/(\.runs\/[A-Za-z0-9_.\-\/]+\.(?:wav|mp3|m4a|ogg|png|jpe?g|webp|mp4|webm))/);
    if(!mm)return out;
    const src=mediaSrc(mm[1],mm[2]);
    return src?out+`<span class="termmedia">${mediaTag(src,mm[2])}</span>`:out;
  }).join("\n");
}
function colorLine(line){
  return [line].map(line=>{
    const t=line.trimStart();
    if(t.startsWith("✎"))return `<span class="l-edit">${line}</span>`;
    if(t.startsWith("⚖"))return `<span class="l-verdict">${line}</span>`;
    if(t.startsWith("▣"))return `<span class="l-step">${line}</span>`;
    if(t.startsWith("◈"))return `<span class="l-sim">${line}</span>`;
    if(t.startsWith("✓"))return `<span class="l-pass">${line}</span>`;
    if(t.startsWith("⚠"))return `<span class="l-warn">${line}</span>`;
    if(t.startsWith("✕")||t.startsWith("✗"))return `<span class="l-fail">${line}</span>`;
    if(t.startsWith("»")||t.startsWith("│"))return `<span class="l-prompt">${line}</span>`;
    if(t.startsWith("⏱"))return `<span class="l-warn">${line}</span>`;
    if(t.startsWith("~ REASON"))return `<span class="l-reason">${line}</span>`;
    if(t.startsWith("· ANSWER"))return `<span class="l-answer">${line}</span>`;
    if(t.startsWith("◆"))return `<span class="l-metric">${line}</span>`;
    if(t.startsWith("→"))return `<span class="l-act">${line}</span>`;
    if(t.startsWith("←"))return `<span class="l-observe">${line}</span>`;
    if(t.startsWith("═"))return `<span class="l-result">${line}</span>`;
    if(t.startsWith("━")||t.startsWith("┌")||t.startsWith("└"))return `<span class="l-banner">${line}</span>`;
    if(t.startsWith("$")||t.startsWith("docker")||t.startsWith("ollama")||t.startsWith("curl")||
       t.startsWith("export")||t.startsWith("git")||t.startsWith("./")||t.startsWith(".venv/"))return `<span class="l-cmd">${line}</span>`;
    return line;
  })[0];
}

async function runFile(fi,rel){
  if(RUNNING)return;                       // one run at a time, client-side too
  RUNNING=true;setRunButtons(true);
  const k=fileKey(fi,rel),id=fid(fi,rel);
  const btn=$(`runbtn-${id}`),orig=btn?btn.innerHTML:"▶ Run";
  if(btn)btn.innerHTML=`<span class="sp"></span> ${esc(tr("running"))}`;
  const tw=$(`tw-${id}`);if(tw)tw.style.display="block";
  const f0=$(`foot-${id}`);if(f0){f0.innerHTML="";f0.classList.remove("show");}
  termCache[k]="";footCache[k]="";
  let text="";const mode=brainLabel()+(effMode()==="ollama"?" · "+pickModel():"");
  try{
    const resp=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({folder:COURSE[fi].folder,file:rel,env:envFor()})});
    if(!resp.ok||!resp.body)throw new Error("HTTP "+resp.status);
    const reader=resp.body.getReader(),dec=new TextDecoder();
    let code=null,dur=null;
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      text+=dec.decode(value,{stream:true});
      const m=text.indexOf("__EXIT__");
      const disp=m>=0?text.slice(0,m):text;
      if(m>=0){
        const r=text.slice(m).match(/__EXIT__ (\-?\d+) ([\d.]+)/);
        if(r){code=parseInt(r[1]);dur=r[2];}
      }
      termCache[k]=colorize(disp);
      const t=$(`term-${id}`);
      if(t){t.innerHTML=termCache[k];t.scrollTop=t.scrollHeight;}
    }
    let fh;
    const isEx=rel.indexOf("exercises/")===0&&rel.indexOf("/solutions/")<0;
    if(code===null)fh=`<span class="pass">✓ stream ended</span>`;
    else if(code===0)fh=`<span class="pass">✓ exit 0</span> · ${esc(dur)}s · brain=${esc(mode)}`;
    else if(code===124)fh=`<span class="failc">✕ timed out</span> · ${esc(dur)}s — hit the ${RUNTMO}s cap`;
    else if(isEx)fh=`<span class="failc">${esc(tr("notDone"))}</span>`;
    else fh=`<span class="failc">✕ exit ${code}</span> · ${esc(dur)}s — see output above`;
    footCache[k]=fh;
    const f=$(`foot-${id}`);
    if(f){f.innerHTML=fh;f.classList.add("show");}
  }catch(e){
    termCache[k]=(termCache[k]||"")+`\n<span class="l-fail">client error: ${esc(e.message||e)}</span>`;
    const t=$(`term-${id}`);if(t)t.innerHTML=termCache[k];
  }
  RUNNING=false;setRunButtons(false);
  if(btn)btn.innerHTML=orig;
  loadHistory().then(()=>renderSpark(fi,rel));
}

  let text="",code=null,dur=null;
  try{
    const resp=await fetch("/api/shell",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({cmd:cmd,target:SH_TARGET,env:envFor()})});
    if(!resp.ok||!resp.body)throw new Error("HTTP "+resp.status);
    const reader=resp.body.getReader(),dec=new TextDecoder();
    const base=SH_HTML;

      const {done,value}=await reader.read();
      if(done)break;
      text+=dec.decode(value,{stream:true});
      const m=text.indexOf("__EXIT__");
      const disp=m>=0?text.slice(0,m):text;
      if(m>=0){
        const r=text.slice(m).match(/__EXIT__ (\-?\d+) ([\d.]+)/);
        if(r){code=parseInt(r[1]);dur=r[2];}
      }
      SH_HTML=base+colorize(disp);
      const t=$("sh-term");t.innerHTML=SH_HTML;t.scrollTop=t.scrollHeight;
    }
    if(code===0)shState("ok",`✓ exit 0 · ${dur}s`);

    else shState("ok","stream ended");

document.addEventListener("DOMContentLoaded",()=>{
  const inp=$("sh-in");
  inp.addEventListener("input",shGrow);
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();runShell();}
    else if(e.key==="ArrowUp"&&inp.selectionStart===0&&SH_HIST.length){
      e.preventDefault();SH_HI=Math.max(0,SH_HI-1);inp.value=SH_HIST[SH_HI]||"";shGrow();
    }else if(e.key==="ArrowDown"&&inp.selectionStart>=inp.value.length&&SH_HIST.length){
      e.preventDefault();SH_HI=Math.min(SH_HIST.length,SH_HI+1);inp.value=SH_HIST[SH_HI]||"";shGrow();

/* ═══ SVG diagram toolkit — arch / sequence / charts, fully spec-driven ═══ */
const REDUCED=!!(typeof window!=="undefined"&&window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const DCOL={green:"var(--green)",cyan:"var(--cyan)",amber:"var(--amber)",violet:"var(--violet)",red:"var(--red)"};
const DCYCLE=["green","cyan","amber","violet","red"];
let DUID=0;
const dcol=c=>DCOL[c]||DCOL.green;
function fmtV(v){
  const n=+v,a=Math.abs(n);
  if(!isFinite(n))return "–";
  if(a>=1000)return (n/1000).toFixed(1).replace(/\.0$/,"")+"k";
  if(a>=100)return String(Math.round(n));
  return String(+n.toFixed(1));
}
function wrapTxt(s,maxC,maxL){
  const out=[];let cur="";
  for(const w of String(s==null?"":s).split(/\s+/)){
    if(!w)continue;
    if(!cur)cur=w;
    else if((cur+" "+w).length<=maxC)cur+=" "+w;
    else{out.push(cur);cur=w;}
  }
  if(cur)out.push(cur);
  if(!out.length)out.push("");
  if(out.length>maxL){out.length=maxL;out[maxL-1]=out[maxL-1].slice(0,Math.max(1,maxC-1))+"…";}
  return out;
}
function svgTxt(x,y,txt,attrs){return `<text x="${x}" y="${y}" ${attrs||""}>${esc(txt)}</text>`;}

/* drawArch: horizontal lanes, auto column layout by edge topology, orthogonal edges,
   SMIL pulse dots on animated edges (skipped under prefers-reduced-motion) */
function drawArch(spec){
  const uid="dg"+(++DUID);
  const lanes=spec.lanes||[],nodes=spec.nodes||[];
  const ids=new Set(nodes.map(n=>n.id));
  const edges=(spec.edges||[]).filter(e=>ids.has(e.from)&&ids.has(e.to));
  const NW=200,NH=58,CG=64,RG=16,GUT=118;
  // longest-path column assignment over the DAG; back-edges (cycles) are
  // dropped from the layout so a feedback loop can't inflate the canvas.
  const col={},succ={},state={},topo=[];
  nodes.forEach(n=>{col[n.id]=0;succ[n.id]=[];state[n.id]=0;});
  edges.forEach(e=>succ[e.from].push(e.to));
  const dfs=id=>{state[id]=1;succ[id].forEach(t=>{if(!state[t])dfs(t);});state[id]=2;topo.push(id);};
  nodes.forEach(n=>{if(!state[n.id])dfs(n.id);});
  topo.reverse();
  const tix={};topo.forEach((id,i)=>{tix[id]=i;});
  topo.forEach(id=>succ[id].forEach(t=>{
    if(tix[t]>tix[id]&&col[id]+1>col[t])col[t]=col[id]+1;
  }));
  const maxCol=nodes.reduce((m,n)=>Math.max(m,col[n.id]),0);
  const pos={},laneBand=[];let y=8;
  lanes.forEach((l,li)=>{
    const perCol={};let rows=1;
    nodes.filter(n=>n.lane===l.id).forEach(n=>{
      const c=col[n.id],r=perCol[c]||0;perCol[c]=r+1;rows=Math.max(rows,r+1);
      pos[n.id]={x:GUT+c*(NW+CG),row:r};
    });
    const lh=rows*(NH+RG)+RG;
    nodes.filter(n=>n.lane===l.id).forEach(n=>{pos[n.id].y=y+RG+pos[n.id].row*(NH+RG);});
    laneBand.push({label:l.label,y:y,h:lh,alt:li%2===1});
    y+=lh+6;
  });
  const W=GUT+(maxCol+1)*(NW+CG)-CG+14,H=y+2;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||"architecture")}">`;
  g+=`<defs><marker id="ar-${uid}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" `+
     `orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dim)"/></marker></defs>`;
  laneBand.forEach(b=>{
    g+=`<rect x="0" y="${b.y}" width="${W}" height="${b.h}" rx="10" class="dg-lane${b.alt?" alt":""}"/>`;
    const ls=wrapTxt(b.label,15,3);
    ls.forEach((ln,i)=>{g+=svgTxt(12,b.y+b.h/2-(ls.length-1)*6+i*12+3,ln,`class="dg-lanelbl"`);});
  });
  let anim=0;
  edges.forEach((e,ei)=>{
    const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
    let d,lx,ly;
    if(b.x>a.x){                                        // left → right elbow
      const x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2;
      const mx=(x1+x2)/2+((ei%3)-1)*10;
      d=`M ${x1} ${y1} L ${mx} ${y1} L ${mx} ${y2} L ${x2} ${y2}`;
      lx=mx;ly=(y1===y2)?y1-6:(y1+y2)/2-6;
    }else{                                              // same column / backward → vertical route
      const x1=a.x+NW/2,y1=a.y+NH,x2=b.x+NW/2,y2=b.y;
      const my=(y1+y2)/2;
      d=`M ${x1} ${y1} L ${x1} ${my} L ${x2} ${my} L ${x2} ${y2}`;
      lx=(x1+x2)/2;ly=my-6;
    }
    const pid=`${uid}-e${ei}`;
    const st=e.animated?`stroke="rgba(63,185,80,.6)" stroke-width="1.6"`:`stroke="var(--line)" stroke-width="1.4"`;
    g+=`<path id="${pid}" d="${d}" fill="none" ${st} marker-end="url(#ar-${uid})"/>`;
    if(e.label)g+=svgTxt(lx,ly,e.label,`text-anchor="middle" class="dg-elbl"`);
    if(e.animated&&!REDUCED){                           // house dataflow pulse — SMIL, gated on reduced motion
      g+=`<circle r="3.4" fill="var(--accent)" opacity=".95" style="filter:drop-shadow(0 0 4px rgba(63,185,80,.9))">`+
         `<animateMotion dur="3s" repeatCount="indefinite" begin="${(anim++)*1.1}s"><mpath href="#${pid}" xlink:href="#${pid}"/></animateMotion></circle>`;
    }
  });
  nodes.forEach(n=>{
    const p=pos[n.id];if(!p)return;
    g+=`<g><title>${esc(n.label+(n.sub?" — "+n.sub:""))}</title>`+
       `<rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="9" fill="var(--panel2)" stroke="var(--line)"/>`+
       `<rect x="${p.x}" y="${p.y+9}" width="3" height="${NH-18}" rx="1.5" fill="${dcol(n.accent)}"/>`+
       svgTxt(p.x+13,p.y+20,wrapTxt(n.label,31,1)[0],`class="dg-nlbl"`);
    if(n.sub)wrapTxt(n.sub,42,2).forEach((ln,i)=>{g+=svgTxt(p.x+13,p.y+34+i*11,ln,`class="dg-nsub"`);});
    g+=`</g>`;
  });
  return g+`</svg>`;
}

/* drawSeq: vertical lifelines, calls solid / returns dashed / notes as pills,
   arrows fade in staggered (CSS, gated on reduced motion) */
function drawSeq(spec){
  const uid="sq"+(++DUID);
  const actors=spec.actors||[];
  const aids=new Set(actors.map(a=>a.id));
  const steps=(spec.steps||[]).filter(s=>aids.has(s.from)&&aids.has(s.to));
  const n=Math.max(actors.length,1);
  const colW=Math.max(180,Math.round(940/n));
  const W=n*colW,rowH=48,y0=66,H=y0+steps.length*rowH+16;
  const ax={};actors.forEach((a,i)=>ax[a.id]=colW/2+i*colW);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title||"sequence")}">`;
  g+=`<defs>`+
     `<marker id="sc-${uid}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>`+
     `<marker id="sr-${uid}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dim)"/></marker>`+
     `</defs>`;
  actors.forEach(a=>{
    const x=ax[a.id],bw=Math.min(colW-24,190);
    g+=`<line x1="${x}" y1="44" x2="${x}" y2="${H-8}" stroke="var(--line)" stroke-dasharray="3 5"/>`+
       `<rect x="${x-bw/2}" y="8" width="${bw}" height="32" rx="8" fill="var(--panel2)" stroke="var(--line)"/>`+
       svgTxt(x,28,wrapTxt(a.label,Math.floor(bw/6),1)[0],`text-anchor="middle" class="dg-actor"`);
  });
  steps.forEach((s,i)=>{
    const y=y0+i*rowH+18,x1=ax[s.from],x2=ax[s.to];
    g+=`<g class="sqs" style="animation-delay:${i*100}ms">`;
    if(s.kind==="note"){
      const cx=(x1+x2)/2,lines=wrapTxt(s.label,52,2);
      const w=Math.min(W-30,Math.max(...lines.map(l=>l.length))*5.6+28);
      const ph=lines.length*13+10,top=y-ph+8;
      g+=`<rect x="${cx-w/2}" y="${top}" width="${w}" height="${ph}" rx="${Math.min(12,ph/2)}" `+
         `fill="rgba(210,153,34,.07)" stroke="rgba(210,153,34,.4)"/>`;
      lines.forEach((ln,li)=>{g+=svgTxt(cx,top+14+li*13,ln,`text-anchor="middle" class="dg-note"`);});
    }else{
      const ret=s.kind==="return";
      const st=ret?`stroke="var(--dim)" stroke-dasharray="6 4" marker-end="url(#sr-${uid})"`
                  :`stroke="var(--accent)" marker-end="url(#sc-${uid})"`;
      if(x1===x2){                                      // self message loop
        g+=`<path d="M ${x1} ${y-6} h 46 v 12 h -46" fill="none" ${st} stroke-width="1.5"/>`;
        wrapTxt(s.label,40,2).forEach((ln,li)=>{g+=svgTxt(x1+54,y+li*12,ln,`class="dg-msg${ret?" ret":""}"`);});
      }else{
        g+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" ${st} stroke-width="1.5"/>`;
        const cx=(x1+x2)/2,maxC=Math.max(16,Math.floor(Math.abs(x2-x1)/5.6)-2);
        const lines=wrapTxt(s.label,maxC,2);
        lines.forEach((ln,li)=>{g+=svgTxt(cx,y-8-(lines.length-1-li)*12,ln,`text-anchor="middle" class="dg-msg${ret?" ret":""}"`);});
      }
    }
    g+=`</g>`;
  });
  return g+`</svg>`;
}

/* drawChart: bars / hbars / line / donut — grow/draw-in when scrolled into view */
function drawChart(spec){
  const t=spec.type;
  if(t==="hbars")return chartHBars(spec);
  if(t==="line")return chartLine(spec);
  if(t==="donut")return chartDonut(spec);
  return chartBars(spec);
}
function legendHTML(spec){
  const items=(spec.series||[]).map((s,i)=>({c:dcol(s.color||DCYCLE[i%5]),t:s.name||("series "+(i+1))}));
  if(!items.length)return "";
  return `<div class="dlegend">`+items.map(it=>`<span><i style="background:${it.c}"></i>${esc(it.t)}</span>`).join("")+`</div>`;
}
function chartBars(spec){
  const labels=spec.labels||[],series=spec.series||[];
  const W=460,H=250,padL=12,padR=12,padT=24,padB=36;
  const plotW=W-padL-padR,plotH=H-padT-padB,baseY=H-padB;
  const max=Math.max(1e-9,...series.flatMap(s=>(s.values||[]).map(v=>+v||0)));
  const gW=plotW/Math.max(labels.length,1),m=Math.max(series.length,1);
  const bw=Math.max(8,Math.min(40,(gW-16-(m-1)*5)/m));
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  [0.5,1].forEach(f=>{
    const yy=baseY-plotH*f;
    g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-dasharray="2 5" opacity=".6"/>`+
       svgTxt(padL,yy-4,fmtV(max*f)+(spec.unit?" "+spec.unit:""),`class="dg-axis"`);
  });
  g+=`<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--line)"/>`;
  labels.forEach((lb,li)=>{
    const gx=padL+li*gW,off=(gW-(m*bw+(m-1)*5))/2;
    series.forEach((s,si)=>{
      const v=+((s.values||[])[li]||0),bh=Math.max(1,v/max*plotH);
      const x=gx+off+si*(bw+5),yv=baseY-bh,c=dcol(s.color||DCYCLE[si%5]),dl=(li*m+si)*60;
      g+=`<rect class="cbar" x="${x.toFixed(1)}" y="${yv.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" `+
         `fill="${c}" fill-opacity=".85" style="transition-delay:${dl}ms">`+
         `<title>${esc((s.name||"")+" · "+lb+": "+v+(spec.unit?" "+spec.unit:""))}</title></rect>`+
         svgTxt(x+bw/2,yv-4,fmtV(v),`text-anchor="middle" class="dg-val cval" style="transition-delay:${dl+250}ms"`);
    });
    wrapTxt(lb,Math.floor(gW/6),2).forEach((ln,i)=>{g+=svgTxt(gx+gW/2,baseY+13+i*11,ln,`text-anchor="middle" class="dg-axis"`);});
  });
  return g+`</svg>`+legendHTML(spec);
}
function chartHBars(spec){
  const labels=spec.labels||[],series=spec.series||[],m=Math.max(series.length,1);
  const W=460,padL=118,padR=54,padT=8,rowH=16,gGap=14;
  const H=padT+labels.length*(m*rowH+gGap)+8,plotW=W-padL-padR;
  const max=Math.max(1e-9,...series.flatMap(s=>(s.values||[]).map(v=>+v||0)));
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  g+=`<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-6}" stroke="var(--line)"/>`;
  labels.forEach((lb,li)=>{
    const gy=padT+li*(m*rowH+gGap),ls=wrapTxt(lb,20,2);
    ls.forEach((ln,i)=>{g+=svgTxt(padL-8,gy+(m*rowH)/2+4-(ls.length-1)*5.5+i*11,ln,`text-anchor="end" class="dg-axis"`);});
    series.forEach((s,si)=>{
      const v=+((s.values||[])[li]||0),bwd=Math.max(1,v/max*plotW),yb=gy+si*rowH;
      const c=dcol(s.color||DCYCLE[si%5]),dl=(li*m+si)*60;
      g+=`<rect class="chbar" x="${padL}" y="${yb+2}" width="${bwd.toFixed(1)}" height="${rowH-5}" rx="3" `+
         `fill="${c}" fill-opacity=".85" style="transition-delay:${dl}ms">`+
         `<title>${esc((s.name||"")+" · "+lb+": "+v+(spec.unit?" "+spec.unit:""))}</title></rect>`+
         svgTxt(padL+bwd+5,yb+rowH-4,fmtV(v)+(li===0&&si===0&&spec.unit?" "+spec.unit:""),
                `class="dg-val cval" style="transition-delay:${dl+250}ms"`);
    });
  });
  return g+`</svg>`+legendHTML(spec);
}
function chartLine(spec){
  const labels=spec.labels||[],series=spec.series||[];
  const W=460,H=240,padL=40,padR=46,padT=14,padB=30;
  const plotW=W-padL-padR,plotH=H-padT-padB,baseY=H-padB;
  const all=series.flatMap(s=>(s.values||[]).map(v=>+v||0));
  const max=Math.max(1e-9,...all),min=Math.min(0,...all);
  const n=Math.max(labels.length,2);
  const X=i=>padL+i*(plotW/(n-1));
  const Y=v=>baseY-((v-min)/((max-min)||1))*plotH;
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  [0,0.5,1].forEach(f=>{
    const vv=min+(max-min)*f,yy=Y(vv);
    g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-dasharray="2 5" opacity=".6"/>`+
       svgTxt(padL-5,yy+3,fmtV(vv),`text-anchor="end" class="dg-axis"`);
  });
  if(spec.unit)g+=svgTxt(padL-5,padT-2,spec.unit,`text-anchor="end" class="dg-axis"`);
  const step=Math.max(1,Math.ceil(labels.length/8));
  labels.forEach((lb,i)=>{
    if(i%step===0||i===labels.length-1)g+=svgTxt(X(i),baseY+15,String(lb),`text-anchor="middle" class="dg-axis"`);
  });
  series.forEach((s,si)=>{
    const c=dcol(s.color||DCYCLE[si%5]),vals=s.values||[];
    const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(+v||0).toFixed(1)}`).join(" ");
    g+=`<polyline class="cline" points="${pts}" fill="none" stroke="${c}" stroke-width="2" pathLength="1" `+
       `style="transition-delay:${si*180}ms"/>`;
    vals.forEach((v,i)=>{
      g+=`<circle class="cdot" cx="${X(i).toFixed(1)}" cy="${Y(+v||0).toFixed(1)}" r="3" fill="${c}" `+
         `style="transition-delay:${300+i*40+si*180}ms"><title>${esc(String(labels[i])+": "+v)}</title></circle>`;
    });
    const lv=+(vals[vals.length-1]||0);
    g+=svgTxt(X(vals.length-1)+7,Y(lv)+3,fmtV(lv),`class="dg-val cval" style="transition-delay:${900+si*150}ms;fill:${c}"`);
  });
  return g+`</svg>`+legendHTML(spec);
}
function chartDonut(spec){
  const labels=spec.labels||[],s0=(spec.series||[])[0]||{values:[]};
  const vals=labels.map((_,i)=>+((s0.values||[])[i]||0));
  const total=vals.reduce((a,b)=>a+b,0)||1e-9;
  const W=460,H=230,cx=125,cy=115,r=76,sw=27;
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="${sw}"/>`;
  let acc=0;
  vals.forEach((v,i)=>{
    const pct=v/total*100,seg=Math.max(pct-1.2,0.4).toFixed(2);
    const c=dcol((s0.color&&vals.length===1)?s0.color:DCYCLE[i%5]);
    g+=`<circle class="cseg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" `+
       `pathLength="100" stroke-dasharray="${seg} 100" data-d="${seg} 100" `+
       `style="stroke-dasharray:0 100;transition-delay:${i*120}ms" stroke-dashoffset="${(-acc).toFixed(2)}" `+
       `transform="rotate(-90 ${cx} ${cy})"><title>${esc(labels[i]+": "+v)}</title></circle>`;
    acc+=pct;
  });
  g+=svgTxt(cx,cy-2,fmtV(total),`text-anchor="middle" class="dg-big"`);
  if(spec.unit)g+=svgTxt(cx,cy+16,spec.unit,`text-anchor="middle" class="dg-axis"`);
  labels.forEach((lb,i)=>{
    const ly=44+i*22;
    g+=`<circle cx="240" cy="${ly-4}" r="4" fill="${dcol(DCYCLE[i%5])}"/>`+
       svgTxt(252,ly,`${lb} — ${fmtV(vals[i])}${spec.unit?" "+spec.unit:""} (${Math.round(vals[i]/total*100)}%)`,`class="dg-axis"`);
  });
  return g+`</svg>`;
}

/* the 'diagrams' section: arch + sequence full-width, charts in a 2-up metric grid */
function dcardHTML(title,body,caption,unit){
  return `<div class="dcard"><h3 class="dtitle">${esc(title||"")}${unit?`<span class="dunit">${esc(unit)}</span>`:""}</h3>`+
         body+(caption?`<p class="dcap">${esc(caption)}</p>`:"")+`</div>`;
}
function diagramsBlock(fi){
  const d=COURSE[fi]&&COURSE[fi].diagrams;
  if(!d)return `<div class="pwarn">⚠ no diagrams.json for this lab yet — nothing to visualize.</div>`;
  let h=`<div class="diagwrap">`;
  try{if(d.architecture)h+=dcardHTML(d.architecture.title,drawArch(d.architecture),d.architecture.caption);}
  catch(e){h+=`<div class="pwarn">⚠ architecture diagram failed: ${esc(e.message||e)}</div>`;}
  try{if(d.sequence)h+=dcardHTML(d.sequence.title,drawSeq(d.sequence),d.sequence.caption);}
  catch(e){h+=`<div class="pwarn">⚠ sequence diagram failed: ${esc(e.message||e)}</div>`;}
  if(Array.isArray(d.charts)&&d.charts.length){
    h+=`<div class="diag-grid">`;
    d.charts.forEach(ch=>{
      try{h+=dcardHTML(ch.title,`<div class="dchart">${drawChart(ch)}</div>`,ch.caption,ch.unit);}
      catch(e){h+=`<div class="pwarn">⚠ chart failed: ${esc(e.message||e)}</div>`;}
    });
    h+=`</div>`;
  }
  return h+`</div>`;
}
/* arm chart animations on first scroll into view */
let chartIO=null;
function armCharts(){
  const els=document.querySelectorAll(".dchart:not(.iv)");
  if(!els.length)return;
  const fire=el=>{
    el.classList.add("iv");
    el.querySelectorAll(".cseg").forEach(s=>{if(s.dataset.d)s.style.strokeDasharray=s.dataset.d;});
  };
  if(REDUCED||typeof IntersectionObserver==="undefined"){els.forEach(fire);return;}
  if(chartIO)chartIO.disconnect();
  chartIO=new IntersectionObserver(entries=>{
    entries.forEach(en=>{if(en.isIntersecting){fire(en.target);chartIO.unobserve(en.target);}});
  },{root:$("content"),threshold:0.25});
  els.forEach(el=>chartIO.observe(el));
}
