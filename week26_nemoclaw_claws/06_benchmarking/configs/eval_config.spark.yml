# Lab 06-2 · Alto Ops Claw eval on the DGX SPARK host — the research tutorial's Lab 5.2 `eval_config.yml`,
# verbatim below the workflow (= common/alto_ops/src/alto_ops/configs/workflow.spark.yml, vLLM on :8000).
# Copy to ~/alto_ops/ on the Spark next to data/, then:  nat eval --config_file eval_config.yml
# `nat validate` accepts every key below on NAT 1.9.0 (checked by lab06_2 on the laptop).
functions:
  chiller_kpi:
    _type: chiller_kpi
    csv_path: ./data/chiller_plant.csv
    kw_per_rt_alarm: 0.80
  current_datetime:
    _type: current_datetime
llms:
  local_vllm:
    _type: openai
    base_url: http://localhost:8000/v1
    api_key: EMPTY
    model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
    temperature: 0.0
workflow:
  _type: tool_calling_agent
  llm_name: local_vllm
  tool_names: [chiller_kpi, current_datetime]
  verbose: true
  handle_tool_errors: true
eval:
  general:
    output_dir: ./.tmp/eval/alto_ops/
    max_concurrency: 4
    dataset:
      _type: jsonl
      file_path: ./data/alto_ops_eval.jsonl
    profiler:
      token_uniqueness_forecast: true
      workflow_runtime_forecast: true
      compute_llm_metrics: true
      csv_exclude_io_text: true
      prompt_caching_prefixes:
        enable: true
        min_frequency: 0.5
      bottleneck_analysis:
        enable_nested_stack: true
      concurrency_spike_analysis:
        enable: true
        spike_threshold: 7
  evaluators:
    accuracy:
      _type: ragas
      metric: AnswerAccuracy
      llm_name: local_vllm
    trajectory:
      _type: trajectory
      llm_name: local_vllm
