# Alto Ops Claw v1: evaluation, profiling and sizing (capstone deliverables 4 and 5). This is research tutorial Lab 5.2.
# Run it from the bundle directory on the Spark host (~/alto-ops-claw-v1). The image also ships it at
# /app/eval_config.yml, and paths are relative, so the same file runs inside the sandbox (WORKDIR /sandbox, data
# uploaded to /sandbox/data) for the sandbox-tax leg.
#   Nano  (default):  nat eval --config_file eval_config.yml
#   Super (A/B):      nat eval --config_file eval_config.yml --override workflow.llm_name super \
#                       --override eval.general.output_dir ./.tmp/eval/alto_ops/super
# The judge is `nano` for BOTH runs, so the comparison is fair. It is also biased: it is the same small model.
# For a real report, use a stronger judge (research tutorial Lab 5.2).
functions:
  chiller_kpi:
    _type: chiller_kpi
    csv_path: ./data/chiller_plant.csv
    kw_per_rt_alarm: 0.80
  request_setpoint_change:
    _type: request_setpoint_change
  current_datetime:
    _type: current_datetime
llms:
  nano:                                    # vLLM from Lab 3.2 (the same model the sandbox reaches via inference.local)
    _type: openai
    base_url: http://localhost:8000/v1
    api_key: EMPTY
    model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
    temperature: 0.0
  super:                                   # the Ollama tag in the research tutorial's Part 5.2 table (Exxact)
    _type: openai
    base_url: http://localhost:11434/v1
    api_key: EMPTY
    model_name: nemotron-3-super:120b-a12b
    temperature: 0.0
workflow:
  _type: tool_calling_agent
  llm_name: nano
  tool_names: [chiller_kpi, request_setpoint_change, current_datetime]
  handle_tool_errors: true
eval:
  general:
    output_dir: ./.tmp/eval/alto_ops/nano
    max_concurrency: 4
    dataset:
      _type: jsonl
      file_path: ./data/alto_ops_eval.jsonl
    profiler:
      token_uniqueness_forecast: true
      workflow_runtime_forecast: true
      compute_llm_metrics: true
      csv_exclude_io_text: true
      prompt_caching_prefixes:
        enable: true
        min_frequency: 0.5
      bottleneck_analysis:
        enable_nested_stack: true
      concurrency_spike_analysis:
        enable: true
        spike_threshold: 7
  evaluators:
    accuracy:
      _type: ragas
      metric: AnswerAccuracy
      llm_name: nano
    trajectory:
      _type: trajectory
      llm_name: nano
    runtime:
      _type: avg_workflow_runtime
    llm_calls:
      _type: avg_num_llm_calls
    tokens:
      _type: avg_tokens_per_llm_end
