# Lab 06-3 · `nat sizing calc` on THIS LAPTOP — the same Alto Ops workflow as eval_config.yml, with its OWN eval
# output directory (the sizing docs: keep the calculator's output separate from evaluation output).
# The calculator overrides eval.general.max_concurrency per run and forces profiler.base_metrics on.
functions:
  chiller_kpi:
    _type: chiller_kpi
    csv_path: week26/common/data/chiller_plant.csv
    kw_per_rt_alarm: 0.80
  current_datetime:
    _type: current_datetime
llms:
  local_llm:
    _type: openai
    base_url: http://localhost:11434/v1
    api_key: EMPTY                  # required by validation even for keyless servers
    model_name: nemotron-3-nano:latest
    temperature: 0.0
workflow:
  _type: tool_calling_agent
  llm_name: local_llm
  tool_names: [chiller_kpi, current_datetime]
  verbose: false
  handle_tool_errors: true
eval:
  general:
    output_dir: week26/06_benchmarking/.runs/sizing_eval/alto_ops/
    max_concurrency: 1              # overridden per concurrency by the calculator
    dataset:
      _type: jsonl
      file_path: week26/06_benchmarking/data/alto_ops_eval.jsonl
    profiler:
      base_metrics: true
