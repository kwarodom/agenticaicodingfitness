# Week 25 · Capstone — generated by labs/lab04_sandbox_and_scorecard.py (policykit, Module 15).
# Course-designed, validated offline; not yet applied to a sandbox on a real Spark.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /etc]
  read_write: [/sandbox, /tmp, /dev/null]
landlock: {compatibility: best_effort}
process: {run_as_user: sandbox, run_as_group: sandbox}
network_policies:
  inference:
    name: inference
    endpoints:
    - {host: inference.local, port: 443}
    binaries:
    - {path: /sandbox/.venv-nat/bin/python*}
    - {path: /usr/bin/python3*}
    - {path: /usr/bin/curl}
  gateway:
    name: gateway
    endpoints:
    - {host: host.openshell.internal, port: 4000, access: full, tls: skip}
    binaries:
    - {path: /sandbox/.venv-nat/bin/python*}
    - {path: /usr/bin/python3*}
  pypi:
    name: pypi
    endpoints:
    - {host: pypi.org, port: 443, access: full, tls: skip}
    - {host: files.pythonhosted.org, port: 443, access: full, tls: skip}
    binaries:
    - {path: /sandbox/.venv-nat/bin/python*}
    - {path: /usr/bin/python3*}
    - {path: /sandbox/.venv-nat/bin/pip*}
