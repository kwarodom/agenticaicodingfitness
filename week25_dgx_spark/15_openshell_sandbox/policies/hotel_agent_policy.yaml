# Week 25 · Module 15 — OpenShell sandbox policy for the Module 14 NAT hotel agent.
# Same layout as the policy NVIDIA ships with the healthcare-agent playbook
# (dgx-spark-playbooks/nvidia/playbook-healthcare-agent/assets/sandbox-policy.yaml).
#
#   openshell sandbox create --name hotel-agent --from base --policy policies/hotel_agent_policy.yaml --keep ...
#
# Course-designed: parsed by the OpenShell 0.0.111 CLI and checked by policykit.validate() on a laptop,
# not yet applied to a sandbox on a real Spark.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:            # the OS and Python runtime: readable, never writable
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
  read_write:           # the agent's own files: NAT venv, workflow, traces, tickets.jsonl
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  # The shipped policy uses best_effort: hard_requirement crash-loops some community images.
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # The only runtime egress: the model, through OpenShell's inference routing (openshell inference set).
  # inference.local is resolved by the sandbox proxy, not by these rules; listing it documents intent
  # and names the binaries that are expected to call it.
  inference:
    name: inference
    endpoints:
      - host: inference.local
        port: 443
    binaries:
      - { path: "/sandbox/.venv-nat/bin/python*" }
      - { path: "/usr/bin/python3*" }
      - { path: /usr/bin/curl }

  # Setup-only: lets pip inside the sandbox install nvidia-nat. Remove it after setup with
  #   openshell policy update hotel-agent --remove-rule pypi --wait
  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443, access: full, tls: skip }
      - { host: files.pythonhosted.org, port: 443, access: full, tls: skip }
    binaries:
      - { path: "/sandbox/.venv-nat/bin/python*" }
      - { path: "/sandbox/.venv-nat/bin/pip*" }
      - { path: "/usr/bin/python3*" }
